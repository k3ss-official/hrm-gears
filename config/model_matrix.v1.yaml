# hrm-gears model capability matrix v1.0
#
# MVP snapshot. Frozen sources only. The router (Stage 2) will learn this
# table; nothing here is consumed by a trained head yet.
#
# Strict order: free → non-frontier sub → frontier sub →
# non-frontier API → frontier API. Within a tier, cheaper / faster wins.
#
# Vendors locked for MVP:
#   OpenCode Go, Nous Portal, OpenAI OAuth, OpenCode Zen, Nvidia, OpenRouter.

version: "1.0"
rule: "lowest-viable-tier-wins"

tiers:
  1:
    name: free
    models:
      - id: free-opencode-zen
        source: OpenCode Zen
        notes: Primary free lane
      - id: free-openrouter
        source: OpenRouter
        notes: Rotating $0 pool
      - id: free-nous
        source: Nous Portal
        notes: Temporary free windows
  2:
    name: non-frontier-subscription
    models:
      - id: nous-deepseek
        source: Nous Portal
        notes: Cheap reasoning
      - id: nous-nemotron
        source: Nous Portal
        notes: Coding / general
      - id: nous-qwen
        source: Nous Portal
        notes: Qwen3-class
      - id: nous-hy3
        source: Nous Portal
        notes: Mid fill
      - id: openai-nonfrontier
        source: OpenAI OAuth
        notes: Mini / non-Sol class
  3:
    name: frontier-subscription
    models:
      - id: openai-gpt56-sol
        source: OpenAI OAuth
        notes: High-end reasoning
      - id: nous-fable5
        source: Nous Portal
        notes: Agentic
      - id: nous-gemini
        source: Nous Portal
        notes: Long context / multimodal
      - id: opencode-go-frontier
        source: OpenCode Go
        notes: Frontier exposed via Go
  4:
    name: non-frontier-api
    models:
      - id: openrouter-mid
        source: OpenRouter
        notes: Cost-controlled
      - id: nvidia-nemotron
        source: Nvidia
        notes: Nemotron API
      - id: opencode-zen-paid
        source: OpenCode Zen
        notes: Paid non-frontier on Zen
  5:
    name: frontier-api
    models:
      - id: openrouter-frontier
        source: OpenRouter
        notes: Last resort
      - id: nvidia-frontier
        source: Nvidia
        notes: Last resort

capability_axes:
  - reasoning_depth   # shallow | medium | deep | architectural
  - tool_use          # none | light | heavy   (v1 JSONL key; not tool_intensity)
  - domain            # code | research | synthesis | vision | structured
  - context_pressure  # short | long | full-history
  - stakes            # low | medium | high
