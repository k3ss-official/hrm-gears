[project]
name = "hrm-gears"
version = "0.1.0"
description = "Adapt Sapient HRM (27M hierarchical recurrent + ACT) into a cheapest-viable model router."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [{ name = "Tony Whelan", email = "k3ss.official@gmail.com" }]
dependencies = []

[project.urls]
Homepage = "https://github.com/anwhelan01/hrm-gears"
Upstream = "https://github.com/sapientinc/HRM"
Paper = "https://arxiv.org/abs/2506.21734"

[tool.setuptools.packages.find]
include = ["hrm_gear*"]
